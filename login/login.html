<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Academia</title>
    <link href="login.css" rel="stylesheet">
</head>
<body>
    <section class="card">
    <h1 class="titulo1">Olá! Entre com o seu email e senha:</h1>

    <form id="formLogin">
        <input type="email" name="email" id="email" required placeholder="Digite o seu email cadastrado">
        <input type="password" id="senha" placeholder="Digite a sua senha: " required>
        <div class="botoes">
            <button type="submit" id="entrar">Entrar</button>
            <button type="button" id="cadastrar">Não tenho conta</button>
        </div>
    </form>
    <div id="msg"></div>
    </section>
    <script src="login.js"></script>
    <footer>
        <p>&copy; Adailton Pereira</p>
    </footer>
</body>
</html>
